# Render 部署配置文件
# 文档: https://render.com/docs/blueprint-spec
# 将此文件放在仓库根目录，Render 会自动识别

services:
  - type: web
    name: creator-studio
    runtime: node
    plan: free
    buildCommand: |
      cd server && npm install && npm run build &&
      cd ../creator-app && npm install && npm run build &&
      cp -r dist/* ../server/public/
    startCommand: cd server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: AUTH_PASSWORD
        value: 125197
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: COLLECT_INTERVAL
        value: 0 */6 * * *
      - key: HTTP_PROXY
        value: ""
    healthCheckPath: /api/health
    autoDeploy: true
